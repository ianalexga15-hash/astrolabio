# CI de Astrolabio: en cada push y pull request revisa que el panel compile con sus tipos y sus pruebas, y que el bot compile.
# Sin claves: nada aquí lee .env ni habla con MEXC.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    name: Panel (tipos, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas (indicadores iguales a los del bot, vela en vivo y lógica del panel)
        run: npx vitest run
      - name: Tipos y build (tsc --noEmit && vite build)
        run: npm run build

  bot:
    name: Bot (compila)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compila todo el código de Python
        run: python -m compileall -q bot research scripts tests
